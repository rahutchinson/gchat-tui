[project]
name = "gchat-tui"
version = "0.1.0"
description = "Terminal client for Google Chat that works with personal Gmail accounts"
readme = "README.md"
authors = [
    { name = "Ryan Hutchinson", email = "9100245+rahutchinson@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.65.2",
    "textual>=8.2.8",
]

[project.scripts]
gchat-tui = "gchat_tui:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
